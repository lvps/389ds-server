name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Molecule's Docker driver needs a running daemon. Do not rely on the
      # implementation detail that GitHub-hosted Linux runners normally start one.
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          set-host: true

      - name: Verify Docker daemon
        run: docker info

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Keep the controller on the Python version used by the pinned
          # Ansible and Molecule dependencies.
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          env PIP_CONSTRAINT=./constraint.txt pip install -r requirements.txt

      - name: Lint with yamllint
        run: |
          yamllint requirements.yml defaults meta molecule tasks templates --format github

      - name: Lint with ansible-lint
        run: ansible-lint

      - name: Run Molecule tests
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
        run: molecule test --all

