---
dependency:
  name: galaxy
driver:
  name: docker
role_name_check: 1
platforms:
  # Images that contain the string "SYSCTL" run systemd as PID 1.
  - name: Rocky9-TLS
    image: rockylinux:9
    python_package: python3
    python_devel_package: python3-devel
    install_epel: true
    command: /sbin/init
    user: root
    capabilities:
      - SYS_ADMIN
    security_opts:
      - no-new-privileges
    cgroupns_mode: host
    shm_size: 2048M
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /dev/shm:size=2g
provisioner:
  name: ansible
  inventory:
    host_vars:
      Rocky9-TLS:
        # Use the Python 3 interpreter installed for this CentOS 8 platform.
        ansible_python_interpreter: /usr/bin/python3
verifier:
  name: testinfra
